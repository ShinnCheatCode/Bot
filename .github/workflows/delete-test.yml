create or replace function public.delete_shinn_test_keys()
returns json
language plpgsql
security definer
set search_path = public
as $$
declare n int;
begin
  delete from public.keys
  where key like 'Shinn-Cheat-Test%';
  get diagnostics n = row_count;
  return json_build_object('ok', true, 'deleted', n);
end;
$$;

grant execute on function public.delete_shinn_test_keys() to anon, authenticated;
notify pgrst, 'reload schema';